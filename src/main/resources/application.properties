# ============================================================
# H2 file-based database
# (data persists between app restarts in ./data/habits.mv.db)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/habits;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA / Hibernate
# ============================================================
# Auto-create/update tables from your @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Print every SQL query in console ( great for learning!)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# H2 Web Console (Browser DB Viewer)
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Helpful: don't cache templates while developing
# (so your HTML changes appear without restarting)
# ============================================================
spring.thymeleaf.cache=false