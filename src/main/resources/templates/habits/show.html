<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${habit.name} + ' — Habit'">Habit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .calendar {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 4px;
            max-width: 600px;
        }
        .day {
            aspect-ratio: 1 / 1;
            border-radius: 4px;
            background: #ebedf0;
            transition: transform 0.1s;
        }
        .day:hover { transform: scale(1.25); cursor: help; }
        .day.completed { background: #2ea44f; }
        .day.today { outline: 2px solid #0d6efd; outline-offset: 1px; }
    </style>
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 800px;">

    <a href="/habits" class="btn btn-link mb-3 px-0">← Back to all habits</a>

    <h1 class="mb-1" th:text="${habit.name}">Habit name</h1>
    <p class="text-muted mb-4"
       th:text="${habit.description != null and !habit.description.isEmpty()} ? ${habit.description} : 'No description'">
        Description
    </p>

    <!-- Stats -->
    <div class="d-flex flex-wrap gap-2 mb-4">
        <span class="badge bg-warning text-dark fs-6">
            🔥 Current: <span th:text="${currentStreak}">0</span>
        </span>
        <span class="badge bg-success fs-6">
            🏆 Longest: <span th:text="${longestStreak}">0</span>
        </span>
        <span class="badge bg-info text-dark fs-6">
            ✅ Total: <span th:text="${totalCompletions}">0</span>
        </span>
    </div>

    <!-- Mark done button -->
    <div class="mb-5">
        <button th:if="${doneToday}" class="btn btn-outline-success" disabled>
            ✓ Done today
        </button>
        <form th:unless="${doneToday}"
              th:action="@{'/habits/' + ${habit.id} + '/complete'}"
              method="post" class="d-inline">
            <button type="submit" class="btn btn-success">✅ Mark Done Today</button>
        </form>
    </div>

    <!-- Calendar grid -->
    <h4 class="mb-3">Last 90 days</h4>
    <div class="calendar">
        <div th:each="d : ${days}"
             class="day"
             th:classappend="${d.completed() ? ' completed' : ''} + ${d.date().equals(today) ? ' today' : ''}"
             th:title="${d.date()} + (${d.completed()} ? ' — done ✅' : ' — missed')">
        </div>
    </div>

    <!-- Legend -->
    <div class="d-flex align-items-center gap-3 mt-3 small text-muted">
        <span class="d-flex align-items-center gap-1">
            <span style="width:14px;height:14px;background:#ebedf0;border-radius:3px;display:inline-block"></span>
            Missed
        </span>
        <span class="d-flex align-items-center gap-1">
            <span style="width:14px;height:14px;background:#2ea44f;border-radius:3px;display:inline-block"></span>
            Done
        </span>
        <span class="d-flex align-items-center gap-1">
            <span style="width:14px;height:14px;background:#ebedf0;border:2px solid #0d6efd;border-radius:3px;display:inline-block"></span>
            Today
        </span>
    </div>

</div>
</body>
</html>
