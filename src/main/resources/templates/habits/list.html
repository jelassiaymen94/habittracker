<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Habits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="m-0">🎯 My Habits</h1>
            <a href="/habits/new" class="btn btn-primary">+ New Habit</a>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(habits)}" class="text-center text-muted py-5">
            <p class="mb-2 fs-5">No habits yet.</p>
            <p>Click "New Habit" to start tracking your first one!</p>
        </div>

        <!-- Habit cards -->
        <div th:unless="${#lists.isEmpty(habits)}" class="row g-3">
            <div th:each="h : ${habits}" class="col-md-6 col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body d-flex flex-column">

                        <h5 class="card-title">
                            <a th:href="@{'/habits/' + ${h.id}}"
                               class="text-decoration-none text-dark"
                               th:text="${h.name}">Habit name</a>
                        </h5>

                        <p class="card-text text-muted small"
                            th:text="${h.description != null and !h.description.isEmpty()} ? ${h.description} : 'No description'">
                            Description
                        </p>

                        <!-- Total completions badge -->
                        <!-- Stats row -->
                        <div class="d-flex flex-wrap gap-2 mb-3">
                        <span class="badge bg-warning text-dark">
                            🔥 Current: <span th:text="${currentStreaks.get(h.id)}">0</span>
                        </span>
                            <span class="badge bg-success">
                            🏆 Longest: <span th:text="${longestStreaks.get(h.id)}">0</span>
                        </span>
                            <span class="badge bg-info text-dark">
                            ✅ Total: <span th:text="${totals.get(h.id)}">0</span>
                        </span>
                        </div>

                        <!-- Mark Done button (or already-done state) -->
                        <div class="mt-auto">
                            <!-- Already done today -->
                            <button th:if="${doneToday.get(h.id)}" type="button" class="btn btn-outline-success w-100"
                                disabled>
                                Done today ✅
                            </button>

                            <!-- Not yet done -->
                            <form th:unless="${doneToday.get(h.id)}" th:action="@{'/habits/' + ${h.id} + '/complete'}"
                                method="post" class="m-0">
                                <button type="submit" class="btn btn-success w-100">
                                    Mark Done Today ✅
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
