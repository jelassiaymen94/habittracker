<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Habit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 600px;">

    <h1 class="mb-4">➕ New Habit</h1>

    <form th:action="@{/habits}" th:object="${habit}" method="post" novalidate>

        <div class="mb-3">
            <label for="name" class="form-label">Name *</label>
            <input type="text"
                   id="name"
                   class="form-control"
                   th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                   placeholder="e.g. Read 30 minutes">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <div class="mb-4">
            <label for="description" class="form-label">Description</label>
            <input type="text"
                   id="description"
                   class="form-control"
                   th:field="*{description}"
                   placeholder="Optional notes about this habit">
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">💾 Save</button>
            <a href="/habits" class="btn btn-outline-secondary">Cancel</a>
        </div>

    </form>

</div>
</body>
</html>
